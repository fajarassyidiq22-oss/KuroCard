<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membuka KuroCard...</title>
    
    <!-- Cara 1: HTML Meta Refresh (Pengalihan Otomatis dalam 0 detik) -->
    <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbxv8WuDbXxtzqL9vBl-fc7YuU5mRBndEo4DNTdATrYSi1CSG6stYBhdM4SoW4KSRDzT/exec" />

    <style>
        body { 
            background-color: #09090b; /* Warna gelap senada dengan KuroCard */
            color: #ffffff; 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #18181b;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p {
            font-size: 14px;
            color: #a1a1aa;
        }
    </style>
</head>
<body>

    <div class="spinner"></div>
    <p>Membuka KuroCard...</p>

    <script>
        // Memaksa browser pindah ke link Apps Script secara langsung (bukan iframe)
        window.location.href = "https://script.google.com/macros/s/AKfycbxv8WuDbXxtzqL9vBl-fc7YuU5mRBndEo4DNTdATrYSi1CSG6stYBhdM4SoW4KSRDzT/exec";
    </script>
</body>
</html>
